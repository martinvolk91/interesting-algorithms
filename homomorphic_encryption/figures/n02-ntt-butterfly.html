<figure class="widget" id="w-n02-ntt-butterfly">
  <p class="widget-title">The NTT splits \(X^4 + 1\) one factor at a time</p>
  <p class="widget-hint">Send a, then b, then a·b down the tree. The leaves of a·b are the leaves of a times the leaves of b, mod 17.</p>
  <div class="controls"></div>
  <svg class="ntt-tree" viewBox="0 0 400 262" role="img" aria-label="Remainder tree of the number-theoretic transform for N = 4, q = 17" style="display:block;width:100%;max-width:500px;height:auto;margin:0 auto;font-family:var(--font)"></svg>
  <div class="readout"></div>
  <figcaption>Mod 17, \(X^4 + 1 = (X^2 - 4)(X^2 + 4)\), \(X^2 - 4 = (X - 2)(X + 2)\) and \(X^2 + 4 = (X - 8)(X + 8)\). Taking the remainder mod a factor \(X^2 - c\) means replacing \(X^2\) by \(c\), so each node is computed from its parent with one multiplication per coefficient pair, shared by both children (once added, once subtracted): a butterfly. The leaves are the values at the four roots \(\psi, \psi^5, \psi^3, \psi^7\) with \(\psi = 2\), in the bit-reversed order real NTT code produces. With \(N/2\) butterflies per level and \(\log_2 N\) levels, a transform costs \(\tfrac{N}{2}\log_2 N\) multiplications.</figcaption>
</figure>
<script>
(() => {
  const root = '#w-n02-ntt-butterfly';
  const Q = 17, SUP = ['', '', '²', '³'];
  const mod = v => ((v % Q) + Q) % Q;
  const A = [1, 2, 0, 1], B = [3, 0, 1, 0];
  const AB = [0, 0, 0, 0];
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
    const k = i + j;
    if (k < 4) AB[k] += A[i] * B[j]; else AB[k - 4] -= A[i] * B[j];       // X^4 = −1
  }
  for (let k = 0; k < 4; k++) AB[k] = mod(AB[k]);
  const polyStr = p => p.map((c, k) => !c ? '' : k === 0 ? String(c) : (c === 1 ? '' : c) + 'X' + SUP[k]).filter(Boolean).join(' + ') || '0';
  // the tree: replace X² by ±4, then X by ±2 or ±8
  function tree(p) {
    const c = [mod(p[0] + 4 * p[2]), mod(p[1] + 4 * p[3])], d = [mod(p[0] - 4 * p[2]), mod(p[1] - 4 * p[3])];
    return { c, d, leaves: [mod(c[0] + 2 * c[1]), mod(c[0] - 2 * c[1]), mod(d[0] + 8 * d[1]), mod(d[0] - 8 * d[1])] };
  }
  const POLYS = { a: A, b: B, ab: AB };

  const ui = DS.controls(root + ' .controls', draw);
  const which = ui.choice({ label: 'Polynomial', options: [{ value: 'a', label: 'a' }, { value: 'b', label: 'b' }, { value: 'ab', label: 'a·b' }], value: 'a' });

  const svg = document.querySelector(root + ' svg.ntt-tree');
  const NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, text) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    svg.appendChild(e);
    return e;
  }
  function box(cx, cy, w, title, value, big, series) {
    el('rect', { x: cx - w / 2, y: cy - 24, width: w, height: 48, rx: 8, fill: series ? `color-mix(in srgb, var(--series-${series}) 14%, transparent)` : 'var(--soft)',
      stroke: series ? `var(--series-${series})` : 'var(--line-strong)', 'stroke-width': 1.25 });
    el('text', { x: cx, y: cy - 6, 'text-anchor': 'middle', fill: 'var(--fg-2)', 'font-size': 12.5 }, title);
    el('text', { x: cx, y: cy + 15, 'text-anchor': 'middle', fill: 'currentColor', 'font-size': big ? 18 : 15, 'font-weight': 650 }, value);
  }
  function edge(x0, y0, x1, y1, label, anchor) {
    el('line', { x1: x0, y1: y0, x2: x1, y2: y1, stroke: 'var(--line-strong)', 'stroke-width': 1.5 });
    const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
    el('text', { x: mx + (anchor === 'end' ? -13 : 13), y: my + 4, 'text-anchor': anchor, fill: 'var(--fg-2)', 'font-size': 12.5 }, label);
  }

  function draw() {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    svg.style.color = 'var(--fg)';
    const p = POLYS[which.value], t = tree(p);
    const name = { a: 'a', b: 'b', ab: 'a·b' }[which.value];
    edge(200, 50, 100, 104, 'X² → 4', 'end');
    edge(200, 50, 300, 104, 'X² → −4', 'start');
    edge(100, 152, 50, 206, 'X → 2', 'end');
    edge(100, 152, 150, 206, 'X → −2', 'start');
    edge(300, 152, 250, 206, 'X → 8', 'end');
    edge(300, 152, 350, 206, 'X → −8', 'start');
    box(200, 26, 250, 'mod X⁴ + 1', name + ' = ' + polyStr(p));
    box(100, 128, 170, 'mod X² − 4', polyStr(t.c));
    box(300, 128, 170, 'mod X² + 4', polyStr(t.d));
    const roots = [['2', 'ψ'], ['15', 'ψ⁵'], ['8', 'ψ³'], ['9', 'ψ⁷']];
    [50, 150, 250, 350].forEach((x, i) => box(x, 230, 92, `X = ${roots[i][0]} (${roots[i][1]})`, String(t.leaves[i]), true, 1));
    table();
  }

  function table() {
    const la = tree(A).leaves, lb = tree(B).leaves, lab = tree(AB).leaves;
    const prod = la.map((v, i) => mod(v * lb[i]));
    DS.table(root + ' .readout', {
      columns: ['', { label: 'X = 2', num: true }, { label: 'X = 15', num: true }, { label: 'X = 8', num: true }, { label: 'X = 9', num: true }],
      rows: [
        [{ text: 'a', th: true }, ...la.map(String)],
        [{ text: 'b', th: true }, ...lb.map(String)],
        [{ text: 'a × b, slot by slot', th: true }, ...la.map((v, i) => `${v}·${lb[i]} ≡ ${prod[i]}`)],
        [{ text: 'a·b, from its tree', th: true }, ...lab.map(String)],
      ],
    });
    const N = 16384, lg = 14;
    const ntt = 3 * (N / 2) * lg + N, school = N * N;
    DS.stats(root + ' .readout', [
      { label: 'Butterflies in this tree', value: '4', note: 'N/2 = 2 per level, log₂ N = 2 levels' },
      { label: 'One product at N = 2¹⁴ via the NTT', value: ntt.toLocaleString('en-US'), note: '3 transforms + N slot products' },
      { label: 'Schoolbook at N = 2¹⁴', value: school.toLocaleString('en-US'), note: 'N² products, ' + Math.round(school / ntt) + '× more' },
    ]);
  }
  draw();
})();
</script>
