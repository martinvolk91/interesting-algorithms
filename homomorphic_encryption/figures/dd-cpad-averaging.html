<figure class="widget" id="w-dd-cpad-averaging">
  <p class="widget-title">Averaging away weak flooding (\(\sigma_f = 2^4\))</p>
  <p class="widget-hint">Drag the number of decryptions up until every dot sits inside the ±½ band. At that point rounding the average gives the exact decryption, and the one-shot attack works again.</p>
  <div class="controls"></div>
  <div class="widget-grid">
    <div><p class="panel-title">Average minus the true decryption, per coefficient</p><div class="c-res"></div></div>
    <div><p class="panel-title">Largest of the 16 errors</p><div class="c-max"></div></div>
  </div>
  <div class="readout"></div>
  <figcaption>Replayed from <code>ckks_attack.py</code> with the same random draws: the same result, decrypted again and again with fresh flooding of width 16, averaged coefficient by coefficient. The flooding shrinks like \(\sigma_f/\sqrt{k}\) while the computation noise stays put. In this run all 16 coefficients round correctly from about 4 000 decryptions on; the \((6\sigma_f)^2 = 9\,216\) rule of thumb is the cautious estimate.</figcaption>
</figure>
<script>
(() => {
  const root = '#w-dd-cpad-averaging';
  const SIGMA = 16, N = 16;
  // [decryptions averaged k, key recovered?, (average - m') for each of the 16 coefficients]
  const RUNS = [[1,0,[-1.0,4.0,-17.0,-17.0,-5.0,-4.0,25.0,3.0,-2.0,0.0,-6.0,-2.0,-25.0,4.0,3.0,16.0]],[2,0,[-1.5,-4.5,-10.5,-10.5,-4.0,-7.5,-11.0,12.0,0.0,-5.0,-0.5,-8.5,-19.0,2.0,12.5,29.0]],[3,0,[-3.667,-0.667,-6.333,-9.333,-5.0,-3.667,7.667,11.333,-7.667,-2.667,2.667,-1.667,-3.0,5.0,21.0,20.0]],[5,0,[5.8,-2.0,0.2,-3.8,-1.4,3.6,0.4,9.0,-4.6,-4.8,0.0,-2.2,2.4,2.2,11.0,14.6]],[10,0,[1.9,-3.7,-3.9,9.1,-2.1,1.2,0.2,6.0,-0.2,-2.8,7.3,-1.2,3.2,-1.9,9.7,2.5]],[20,0,[2.4,3.05,-1.8,2.6,-0.25,3.35,-0.3,0.5,-2.05,0.25,3.1,0.7,6.55,0.15,4.2,0.85]],[30,0,[-1.167,2.233,-1.533,4.133,0.9,2.667,-0.9,-0.233,-2.633,-1.633,0.9,1.033,5.1,-0.6,3.467,0.9]],[50,0,[-0.76,0.02,-3.66,4.04,0.04,0.38,0.34,-0.7,-3.62,-0.64,-1.4,-2.54,0.74,0.78,3.12,1.64]],[100,0,[1.57,1.01,-3.36,1.34,-0.16,1.85,-0.05,-0.84,0.22,-0.65,0.65,-1.57,1.35,-1.32,1.94,0.88]],[200,0,[2.1,-0.02,-1.34,2.285,1.115,2.115,-0.69,-1.015,-0.82,-0.5,0.15,-0.525,0.79,-0.86,1.605,1.555]],[300,0,[0.883,-0.38,-0.783,1.01,0.203,0.587,-0.57,-0.213,-0.757,-0.447,0.7,0.093,0.437,-1.043,1.537,0.473]],[500,0,[0.966,0.292,0.294,-0.062,-0.332,0.98,-0.548,0.07,-0.13,-0.112,0.202,0.21,0.486,-0.34,0.722,0.256]],[1000,0,[-0.149,0.145,0.038,0.086,-0.743,0.684,-0.158,0.012,0.155,0.275,-0.335,0.283,0.585,0.031,0.897,-0.826]],[2000,0,[-0.376,0.378,0.178,-0.165,-0.576,0.575,-0.408,-0.288,0.205,0.181,-0.003,0.155,0.561,0.621,0.516,-0.53]],[3000,0,[-0.238,-0.204,0.109,-0.136,-0.551,0.376,-0.344,-0.289,0.546,0.135,-0.244,0.009,0.168,0.485,0.166,-0.495]],[4000,1,[-0.386,-0.101,0.189,0.219,-0.305,0.252,-0.18,-0.291,0.322,0.01,0.021,0.109,-0.018,0.372,0.188,-0.425]],[5000,1,[-0.243,-0.253,0.13,0.026,-0.161,0.042,-0.168,-0.359,-0.001,-0.116,0.005,-0.002,-0.081,0.405,0.089,-0.207]],[6000,1,[-0.134,-0.157,0.191,0.021,-0.167,0.112,-0.175,-0.374,-0.057,-0.136,0.051,0.14,-0.069,0.405,-0.13,-0.235]],[7000,1,[-0.106,-0.097,0.089,0.033,-0.266,0.013,-0.13,-0.211,-0.024,-0.105,0.006,0.042,-0.148,0.253,-0.145,-0.218]],[8000,1,[-0.187,-0.014,0.208,-0.061,-0.28,0.047,-0.055,-0.134,0.073,-0.024,0.034,-0.037,-0.155,0.197,-0.113,-0.198]],[9000,1,[-0.122,0.024,0.107,0.007,-0.27,0.015,-0.159,-0.169,-0.02,0.025,0.043,-0.031,-0.106,0.208,-0.112,-0.175]],[10000,1,[-0.028,0.086,0.044,-0.042,-0.37,-0.014,-0.169,-0.044,0.041,0.068,0.067,-0.045,-0.05,0.156,-0.166,-0.13]],[15000,1,[-0.174,-0.065,0.118,0.016,-0.305,0.028,-0.141,-0.001,-0.102,0.135,-0.04,-0.164,0.105,0.191,-0.162,-0.135]],[20000,1,[-0.193,0.104,0.092,-0.015,-0.257,-0.142,-0.12,0.051,-0.141,0.142,-0.053,-0.089,0.017,0.19,-0.15,-0.189]],[30000,1,[-0.137,0.015,0.134,0.01,-0.14,-0.076,-0.074,0.113,-0.127,0.158,0.064,-0.06,-0.018,0.086,-0.076,-0.22]]];
  const byK = new Map(RUNS.map(r => [r[0], r]));
  const maxAbs = r => Math.max(...r[2].map(Math.abs));
  const RULE = (6 * SIGMA) ** 2;
  const kfmt = k => k.toLocaleString('en-US').replace(/,/g, ' ');

  const ui = DS.controls(root + ' .controls', () => { res.update(); mx.update(); readout(); });
  const kk = ui.slider({ label: 'Flooded decryptions averaged, k', values: RUNS.map(r => r[0]), value: 1000, format: kfmt });

  const res = DS.chart(root + ' .c-res', {
    x: { domain: [-0.7, 15.7], label: 'coefficient', tickValues: [0, 3, 6, 9, 12, 15] },
    y: { domain: [-1, 1], label: 'average − m′' },
    height: 260,
    draw(c) {
      const r = byK.get(kk.value), top = Math.max(1, 1.15 * maxAbs(r));
      c.domain({ y: [-top, top] });
      c.legend([{ label: 'within ±½: rounds to the exact value', series: 1, kind: 'dot' }, { label: 'outside', series: 2, kind: 'dot' }]);
      c.polygon([[-0.7, -0.5], [15.7, -0.5], [15.7, 0.5], [-0.7, 0.5]], { series: 1, stroke: false });
      c.hline(0.5, { dash: true });
      c.hline(-0.5, { dash: true });
      c.scatter(r[2].map((v, k) => ({ x: k, y: v, series: Math.abs(v) < 0.5 ? 1 : 2,
        tip: `coefficient ${k}: ${DS.fmt(v, 3)}` + (Math.abs(v) < 0.5 ? ' (rounds correctly)' : ' (rounds wrong)') })), { r: 5 });
    },
  });

  const mx = DS.chart(root + ' .c-max', {
    x: { type: 'log', domain: [1, 30000], label: 'decryptions averaged, k', tipLabel: 'k =' },
    y: { type: 'log', domain: [0.1, 100], label: 'largest |average − m′|' },
    height: 260,
    draw(c) {
      c.legend([{ label: 'this run', series: 1 }, { label: '3σ_f/√k', series: 2, kind: 'dash' }]);
      c.hline(0.5, { dash: true, label: 'rounding works below ½', at: 'left' });
      c.vline(RULE, { series: 'ink', dash: true, label: '(6σ_f)²', labelPos: 'bottom' });
      c.line(DS.math.linspace(0, Math.log10(30000), 60).map(e => [10 ** e, 3 * SIGMA / Math.sqrt(10 ** e)]), { series: 2, dash: true });
      c.line(RUNS.map(r => [r[0], maxAbs(r)]), { series: 1, label: 'largest error', format: v => DS.fmt(v, 2) });
      const r = byK.get(kk.value);
      c.point(r[0], maxAbs(r), { series: 1, r: 6.5 });
    },
  });

  function readout() {
    const r = byK.get(kk.value), inside = r[2].filter(v => Math.abs(v) < 0.5).length;
    DS.stats(root + ' .readout', [
      { label: 'Largest error', value: DS.fmt(maxAbs(r), 2), note: `expected about σ_f/√k = ${DS.fmt(SIGMA / Math.sqrt(r[0]), 2)} each` },
      { label: 'Coefficients within ½', value: `${inside} of ${N}` },
      { label: 'Key', value: r[1] ? 'recovered' : 'not yet', tone: r[1] ? 'bad' : 'good' },
    ]);
  }
  readout();
})();
</script>
