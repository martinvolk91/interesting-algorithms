<figure class="diagram" id="d-p4-hybrid">
  <svg viewBox="0 0 480 384" style="max-width: 580px" role="img"
       aria-label="Hybrid encryption. Key encapsulation: Alice picks a fresh y, sends c1 = g^y, and both sides derive K = SHA-256(h^y). Data encapsulation: Alice encrypts the message with AES-GCM under K and sends the body; Bob decrypts it and checks the tag.">
    <defs>
      <marker id="p4-hy-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
      </marker>
      <marker id="p4-hy-arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="var(--series-1)"/>
      </marker>
      <marker id="p4-hy-arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="var(--series-3)"/>
      </marker>
    </defs>

    <!-- column heads -->
    <text x="90" y="18" text-anchor="middle" font-weight="650" style="font-size:15px">Alice</text>
    <text x="90" y="36" text-anchor="middle" fill="var(--muted)" style="font-size:13px">has Bob's public h = gˣ</text>
    <text x="240" y="18" text-anchor="middle" fill="var(--muted)" style="font-size:13px">on the wire</text>
    <text x="240" y="36" text-anchor="middle" fill="var(--muted)" style="font-size:13px">(Eve sees this)</text>
    <text x="390" y="18" text-anchor="middle" font-weight="650" style="font-size:15px">Bob</text>
    <text x="390" y="36" text-anchor="middle" fill="var(--muted)" style="font-size:13px">has the secret x</text>

    <!-- band 1: key encapsulation -->
    <rect x="0" y="48" width="480" height="150" rx="8" fill="var(--series-1)" fill-opacity="0.09"/>
    <text x="240" y="68" text-anchor="middle" font-weight="650">KEM: public-key step, once</text>
    <rect x="12" y="80" width="156" height="104" rx="6" fill="var(--bg)" stroke="var(--line-strong)"/>
    <text x="90" y="104" text-anchor="middle" style="font-size:14px">pick a fresh y</text>
    <text x="90" y="135" text-anchor="middle" style="font-size:14px">c₁ = gʸ</text>
    <text x="90" y="166" text-anchor="middle" style="font-size:14px">K = SHA-256(hʸ)</text>
    <rect x="312" y="80" width="156" height="104" rx="6" fill="var(--bg)" stroke="var(--line-strong)"/>
    <text x="390" y="104" text-anchor="middle" style="font-size:14px">receive c₁</text>
    <text x="390" y="135" text-anchor="middle" style="font-size:14px">c₁ˣ = gˣʸ = hʸ</text>
    <text x="390" y="166" text-anchor="middle" style="font-size:14px">K = SHA-256(hʸ)</text>
    <line x1="170" y1="131" x2="309" y2="131" stroke="var(--series-1)" stroke-width="2" marker-end="url(#p4-hy-arrow1)"/>
    <text x="240" y="123" text-anchor="middle" font-weight="650" style="font-size:14px">c₁</text>
    <text x="240" y="149" text-anchor="middle" fill="var(--muted)" style="font-size:13px">32 bytes (X25519)</text>
    <text x="240" y="164" text-anchor="middle" fill="var(--muted)" style="font-size:13px">1,088 (ML-KEM-768)</text>

    <!-- K flows down on both sides -->
    <line x1="90" y1="184" x2="90" y2="250" stroke="currentColor" stroke-width="1.5" marker-end="url(#p4-hy-arrow)"/>
    <text x="99" y="222" font-weight="650" style="font-size:14px">K</text>
    <line x1="390" y1="184" x2="390" y2="250" stroke="currentColor" stroke-width="1.5" marker-end="url(#p4-hy-arrow)"/>
    <text x="399" y="222" font-weight="650" style="font-size:14px">K</text>

    <!-- band 2: data encapsulation -->
    <rect x="0" y="210" width="480" height="168" rx="8" fill="var(--series-3)" fill-opacity="0.09"/>
    <text x="240" y="230" text-anchor="middle" font-weight="650">DEM: symmetric step, every byte</text>
    <rect x="12" y="252" width="156" height="78" rx="6" fill="var(--bg)" stroke="var(--line-strong)"/>
    <text x="90" y="279" text-anchor="middle" style="font-size:14px">message, any size</text>
    <text x="90" y="309" text-anchor="middle" style="font-size:14px">AES-GCM under K</text>
    <rect x="312" y="252" width="156" height="78" rx="6" fill="var(--bg)" stroke="var(--line-strong)"/>
    <text x="390" y="279" text-anchor="middle" style="font-size:14px">AES-GCM under K</text>
    <text x="390" y="309" text-anchor="middle" style="font-size:14px">tag ok → message</text>
    <line x1="170" y1="295" x2="309" y2="295" stroke="var(--series-3)" stroke-width="2" marker-end="url(#p4-hy-arrow3)"/>
    <text x="240" y="287" text-anchor="middle" font-weight="650" style="font-size:14px">body</text>
    <text x="240" y="313" text-anchor="middle" fill="var(--muted)" style="font-size:13px">message size + tag</text>
    <text x="240" y="358" text-anchor="middle" fill="var(--muted)" style="font-size:13px">a tampered body fails the tag check</text>
  </svg>
  <figcaption>Hybrid encryption in two layers. The public-key step runs once and moves only a short
  key; the symmetric step carries the data. One RSA-2048 private-key operation took about 0.19 ms on
  the machine these notes were written on, and AES-128-GCM encrypts about 3 MB in that time. The
  script's part 4 has this shape, with a SHA-256 keystream in place of AES-GCM; real systems derive
  \(K\) with HKDF. TLS 1.3 is the same picture with both sides ephemeral.</figcaption>
</figure>
