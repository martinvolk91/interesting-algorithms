<figure class="widget" id="w-p8-modulus-ladder">
  <p class="widget-title">The ladder of moduli: why switching buys depth</p>
  <p class="widget-hint">Slide q up. With switching, every 10 more bits of q buy one more multiplication. Without it, the bit length of q must double to buy one.</p>
  <div class="controls"></div>
  <div class="widget-grid">
    <div><p class="panel-title">Without modulus switching</p><div class="c-off"></div></div>
    <div><p class="panel-title">Switching down after every multiplication</p><div class="c-on"></div></div>
  </div>
  <div class="readout"></div>
  <figcaption>The idealized model of §8.3: fresh noise \(2^{10}\), every multiplication squares the
    noise (doubles its bit length), and decryption fails once the noise reaches \(q\). The shaded
    gap between modulus and noise is what is left to spend. Without switching the noise eats the
    gap faster and faster. With switching the noise stays between 10 and 20 bits, and the modulus
    shrinks by a fixed 10 bits per multiplication.</figcaption>
</figure>
<script>
(() => {
  const root = '#w-p8-modulus-ladder';
  const B = 10;                                  // fresh noise, in bits
  const SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
  const pow2 = e => '2' + String(e).split('').map(ch => SUP[ch]).join('');

  // Without switching: after k multiplications the noise has B·2^k bits; fine while below log2 q.
  function plain(Q) {
    const pts = [[0, B]];
    let k = 0;
    while (B * 2 ** (k + 1) < Q) { k++; pts.push([k, B * 2 ** k]); }
    return { fit: k, pts, fail: [k + 1, B * 2 ** (k + 1)] };
  }
  // With switching: multiply (noise B → 2B), then switch down by B bits (noise back to B).
  function ladder(Q) {
    const noise = [[0, B]], mod = [[0, Q]];
    let k = 0;
    while (2 * B < Q - B * k) {
      k++;
      noise.push([k, 2 * B], [k, B]);
      mod.push([k, Q - B * (k - 1)], [k, Q - B * k]);
    }
    return { fit: k, noise, mod, fail: [k + 1, 2 * B], failMod: Q - B * k };
  }

  const ui = DS.controls(root + ' .controls', () => { off.update(); on.update(); readout(); });
  const q = ui.slider({ label: 'Modulus q', min: 40, max: 200, step: 10, value: 100, format: pow2 });

  const top = Q => Math.round(Q * 1.15);
  const xMax = () => Math.max(6, ladder(q.value).fit + 2);
  const opts = (draw) => ({
    x: { domain: [0, 10], label: 'multiplications' },
    y: { domain: [0, 110], label: 'bits' },
    height: 250,
    draw(c) {
      const Q = q.value;
      c.domain({ x: [0, xMax()], y: [0, top(Q)] });
      draw(c, Q);
    },
  });

  const off = DS.chart(root + ' .c-off', opts((c, Q) => {
    const p = plain(Q), X = xMax();
    c.area([[0, Q], [p.fit, Q]], { lower: p.pts, series: 1 });
    c.line([[0, Q], [X, Q]], { series: 2, label: 'modulus q' });
    c.line([...p.pts, p.fail], { series: 1, label: 'noise' });
    c.scatter(p.pts, { series: 1, r: 3.5 });
    c.vline(p.fail[0], { series: 'bad', dash: true, label: `multiplication ${p.fail[0]} fails` });
    if (p.fail[1] <= top(Q)) c.point(p.fail[0], p.fail[1], { series: 'bad' });
    c.legend([{ label: 'modulus q', series: 2 }, { label: 'noise', series: 1 }, { label: 'budget left', series: 1, kind: 'rect' }]);
  }));

  const on = DS.chart(root + ' .c-on', opts((c, Q) => {
    const L = ladder(Q);
    c.area(L.mod, { lower: L.noise, series: 1 });
    c.line([...L.mod, [L.fit + 1, L.failMod], [xMax(), L.failMod]], { series: 2, label: 'modulus q' });
    c.line([...L.noise, L.fail], { series: 1, label: 'noise' });
    c.vline(L.fail[0], { series: 'bad', dash: true, label: `multiplication ${L.fail[0]} fails` });
    c.point(L.fail[0], L.fail[1], { series: 'bad' });
    c.legend([{ label: 'modulus q', series: 2 }, { label: 'noise', series: 1 }, { label: 'budget left', series: 1, kind: 'rect' }]);
  }));

  function readout() {
    const Q = q.value, a = plain(Q).fit, b = ladder(Q).fit;
    DS.stats(root + ' .readout', [
      { label: 'Multiplications without switching', value: String(a), note: `noise ${pow2(B * 2 ** a)} after the last` },
      { label: 'Multiplications with switching', value: String(b), note: `ends at modulus ${pow2(Q - B * b)}` },
      { label: 'q = (fresh noise)ᴸ', value: `L = ${Q / B}`, note: `about log₂ L = ${Math.log2(Q / B).toFixed(1)} without, L with` },
    ]);
  }
  readout();
})();
</script>
