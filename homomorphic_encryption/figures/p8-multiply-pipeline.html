<figure class="diagram" id="d-p8-multiply-pipeline">
  <svg viewBox="0 0 440 364" style="max-width: 560px" role="img"
       aria-label="One homomorphic multiplication in the running example. Two ciphertexts of two parts each, (4965, −4321) and (1153, −2718), give a tensor product of three parts, (5 724 645, −18 476 983, 11 744 478). Multiplying by t/q, rounding and reducing mod q gives (−4275, 1523, 1744), which decrypts to 6 with noise −10. Relinearization splits d2 = 1744 into the base-10 digits 4, 4, 7, 1, multiplies them with the relinearization keys and adds the result (3146, 4188) to the first two parts. The result (−1129, −4289) has two parts again and decrypts to 6 with noise 4.">
    <style>
      #d-p8-multiply-pipeline text.m { fill: var(--muted); font-size: 12.5px; }
      #d-p8-multiply-pipeline text.n { font-size: 14px; font-variant-numeric: tabular-nums; }
      #d-p8-multiply-pipeline text.b { font-weight: 650; }
      #d-p8-multiply-pipeline .cell { fill: var(--soft); stroke: var(--line-strong); stroke-width: 1.25; }
      #d-p8-multiply-pipeline .sq { fill: var(--series-2); fill-opacity: .14; stroke: var(--series-2); stroke-width: 1.5; }
      #d-p8-multiply-pipeline .key { fill: var(--series-3); fill-opacity: .12; stroke: var(--series-3); stroke-width: 1.5; }
      #d-p8-multiply-pipeline .gone { fill: none; stroke: var(--line-strong); stroke-dasharray: 4 4; }
    </style>
    <defs>
      <marker id="p8mp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
      </marker>
      <marker id="p8mp-arrow-key" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="var(--series-3)"/>
      </marker>
    </defs>

    <!-- the two input ciphertexts -->
    <text x="105" y="16" text-anchor="middle" class="m">ct₁ = Enc(2), noise 2</text>
    <text x="335" y="16" text-anchor="middle" class="m">ct₂ = Enc(3), noise −1</text>
    <rect class="cell" x="10" y="24" width="92" height="30" rx="5"/>
    <rect class="cell" x="108" y="24" width="92" height="30" rx="5"/>
    <rect class="cell" x="240" y="24" width="92" height="30" rx="5"/>
    <rect class="cell" x="338" y="24" width="92" height="30" rx="5"/>
    <text x="56" y="44" text-anchor="middle" class="n">4965</text>
    <text x="154" y="44" text-anchor="middle" class="n">−4321</text>
    <text x="220" y="44" text-anchor="middle" class="n b">×</text>
    <text x="286" y="44" text-anchor="middle" class="n">1153</text>
    <text x="384" y="44" text-anchor="middle" class="n">−2718</text>

    <!-- tensor product -->
    <text x="10" y="82">Tensor product: multiply out (c₀ + c₁s)(c₀′ + c₁′s)</text>
    <text x="70" y="102" text-anchor="middle" class="m">d₀, times 1</text>
    <text x="210" y="102" text-anchor="middle" class="m">d₁, times s</text>
    <text x="370" y="102" text-anchor="middle" class="m">d₂, times s²</text>
    <rect class="cell" x="10" y="108" width="120" height="30" rx="5"/>
    <rect class="cell" x="150" y="108" width="120" height="30" rx="5"/>
    <rect class="sq" x="310" y="108" width="120" height="30" rx="5"/>
    <text x="70" y="128" text-anchor="middle" class="n">5 724 645</text>
    <text x="210" y="128" text-anchor="middle" class="n">−18 476 983</text>
    <text x="370" y="128" text-anchor="middle" class="n">11 744 478</text>

    <!-- scale by t/q -->
    <text x="10" y="164">Multiply by t/q, round, reduce mod q: Enc(6), noise −10</text>
    <rect class="cell" x="10" y="172" width="120" height="30" rx="5"/>
    <rect class="cell" x="150" y="172" width="120" height="30" rx="5"/>
    <rect class="sq" x="310" y="172" width="120" height="30" rx="5"/>
    <text x="70" y="192" text-anchor="middle" class="n">−4275</text>
    <text x="210" y="192" text-anchor="middle" class="n">1523</text>
    <text x="370" y="192" text-anchor="middle" class="n">1744</text>

    <!-- relinearization -->
    <path d="M370,203 V230" stroke="var(--muted)" stroke-width="1.5" fill="none" marker-end="url(#p8mp-arrow)"/>
    <text x="10" y="232">Relinearize: only d₂ needs the key</text>
    <rect class="key" x="310" y="233" width="120" height="58" rx="5"/>
    <text x="370" y="251" text-anchor="middle" class="m">digits of 1744:</text>
    <text x="370" y="268" text-anchor="middle" class="n">4, 4, 7, 1</text>
    <text x="370" y="285" text-anchor="middle" class="m">Σ digitᵢ · rlkᵢ</text>
    <path d="M309,262 H274" stroke="var(--series-3)" stroke-width="1.5" fill="none" marker-end="url(#p8mp-arrow-key)"/>
    <rect class="key" x="10" y="247" width="120" height="30" rx="5"/>
    <rect class="key" x="150" y="247" width="120" height="30" rx="5"/>
    <text x="70" y="267" text-anchor="middle" class="n">+ 3146</text>
    <text x="210" y="267" text-anchor="middle" class="n">+ 4188</text>
    <path d="M10,288 H270" stroke="currentColor" stroke-width="1.25"/>

    <!-- the result -->
    <rect class="cell" x="10" y="296" width="120" height="30" rx="5"/>
    <rect class="cell" x="150" y="296" width="120" height="30" rx="5"/>
    <rect class="gone" x="310" y="300" width="120" height="26" rx="5"/>
    <text x="70" y="316" text-anchor="middle" class="n b">−1129</text>
    <text x="210" y="316" text-anchor="middle" class="n b">−4289</text>
    <text x="370" y="317" text-anchor="middle" class="m">no s² part</text>
    <text x="10" y="352">Two parts again: decrypts with (1, s) to 6, noise 4</text>
  </svg>
  <figcaption>One whole multiplication with the chapter's running example (\(q = 10000\),
    \(t = 10\), \(\Delta = 1000\), \(s = 3\)). The product grows from two parts to three, and the
    third part \(d_2\) pairs with \(s^2\), which the key vector \((1, s)\) does not have.
    Relinearization feeds the digits of \(d_2\) into the keys \(\mathrm{rlk}_0, \dots,
    \mathrm{rlk}_3\) of §6.2 and adds the result to the other two parts. In the second part,
    1523 + 4188 = 5711 ≡ −4289 (mod 10000).</figcaption>
</figure>
