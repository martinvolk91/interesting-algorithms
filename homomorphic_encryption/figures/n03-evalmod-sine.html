<figure class="widget" id="w-n03-evalmod-sine">
  <p class="widget-title">EvalMod: a sine standing in for “mod q₀”</p>
  <p class="widget-hint">Raise the headroom to 14 bits, the value in <code>toy_ckks.py</code>. Each extra bit of headroom buys two bits of precision.</p>
  <div class="controls"></div>
  <div class="widget-grid">
    <div><p class="panel-title">\(x \bmod q_0\) (sawtooth) and \(\tfrac{q_0}{2\pi}\sin(2\pi x/q_0)\), in units of \(q_0\)</p><div class="c-wide"></div></div>
    <div><p class="panel-title">Zoom on one tooth, in units of the largest message</p><div class="c-zoom"></div></div>
  </div>
  <div class="readout"></div>
  <figcaption>After ModRaise the slots hold \(x = \Delta m + e + q_0 I\), and bootstrapping must remove \(q_0 I\). The exact function, the sawtooth, jumps, and no low-degree polynomial can follow a jump. The sine is smooth and periodic, and near the centre of each tooth it agrees with the sawtooth. So CKKS chooses \(q_0\) much larger than the message (the shaded bands) and approximates the sine. The relative error is about \(\theta^2/6\) with \(\theta = 2\pi \cdot\) message\(/q_0\). That is the source of the 20–30 bits of precision. The toy's bootstrapped result reaches \(2^{-23.3}\), a little below the sine's own limit, because the polynomial approximation of the sine adds error too.</figcaption>
</figure>
<script>
(() => {
  const root = '#w-n03-evalmod-sine';
  const TAU = 2 * Math.PI;
  const sup = n => String(n).split('').map(d => '⁰¹²³⁴⁵⁶⁷⁸⁹'[+d] || (d === '-' ? '⁻' : d)).join('');
  const ui = DS.controls(root + ' .controls', () => { wide.update(); zoom.update(); readout(); });
  const head = ui.slider({ label: 'Headroom: q₀ ÷ largest message', values: [1, 2, 3, 4, 5, 6, 8, 10, 12, 14, 16, 18, 20], value: 3, format: v => '2' + sup(v) + ' (' + v + (v === 1 ? ' bit)' : ' bits)') });
  const eps = () => Math.pow(2, -head.value);         // largest message as a fraction of q0

  const wide = DS.chart(root + ' .c-wide', {
    x: { domain: [-2.5, 2.5], label: 'x / q₀', format: v => DS.fmt(v) },
    y: { domain: [-0.6, 0.6], format: v => DS.fmt(v) },
    height: 250,
    draw(c) {
      const w = eps();
      for (let I = -2; I <= 2; I++) {
        c.polygon([[I - w, -0.6], [I + w, -0.6], [I + w, 0.6], [I - w, 0.6]], { series: 1, stroke: false });
        c.segment(Math.max(-2.5, I - 0.5), -0.5, Math.min(2.5, I + 0.5), 0.5, { series: 'ink', thin: true });
      }
      c.fn(x => Math.sin(TAU * x) / TAU, { series: 2, n: 400, label: 'sine', format: v => DS.fmt(v, 3) });
      c.legend([{ label: 'x mod q₀ (what we need)', series: 'ink' }, { label: 'scaled sine', series: 2 }, { label: 'where the message lives', series: 1, kind: 'rect' }]);
    },
  });

  // u = (x − I·q0) / (largest message), so the message band is |u| ≤ 1 whatever the headroom
  const zoom = DS.chart(root + ' .c-zoom', {
    x: { domain: [-1.5, 1.5], label: 'offset from the tooth centre ÷ largest message', format: v => DS.fmt(v) },
    y: { domain: [-1.6, 1.6], tickValues: [-1, 0, 1], format: v => DS.fmt(v) },
    height: 250,
    draw(c) {
      const w = eps();
      c.polygon([[-1, -1.6], [1, -1.6], [1, 1.6], [-1, 1.6]], { series: 1, stroke: false });
      c.fn(u => u, { series: 'ink', thin: true, label: 'x mod q₀', format: v => DS.fmt(v, 4) });
      c.fn(u => Math.sin(TAU * w * u) / (TAU * w), { series: 2, label: 'sine', format: v => DS.fmt(v, 4) });
      const edge = Math.sin(TAU * w) / (TAU * w);
      c.point(1, edge, { series: 2 });
    },
  });

  function readout() {
    const th = TAU * eps(), rel = th < 1e-3 ? th * th / 6 - Math.pow(th, 4) / 120 : 1 - Math.sin(th) / th;
    const bits = -Math.log2(rel);
    DS.stats(root + ' .readout', [
      { label: 'Message ÷ q₀', value: '2' + sup(-head.value), note: 'θ = 2π · 2' + sup(-head.value) + ' = ' + th.toPrecision(3) },
      { label: 'Relative error of the sine', value: rel.toExponential(1), note: '1 − sin θ / θ at the band edge' },
      { label: 'Precision left', value: bits.toFixed(1) + ' bits', tone: bits >= 20 ? 'good' : bits < 8 ? 'bad' : undefined },
    ]);
  }
  readout();
})();
</script>
